[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-pipeline"
version = "0.1.0"
description = "A typed AIDP v2 kernel for token-efficient agentic software development"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aidp = "aidp.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/aidp"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aidp*"]
