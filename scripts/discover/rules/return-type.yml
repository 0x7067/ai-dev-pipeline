# return-type.yml — ast-grep rules for return type annotation patterns

rules:
  - id: explicit-return-type
    language: typescript
    rule:
      kind: function_declaration
      has:
        field: return_type
    message: "explicit return type detected"

  - id: explicit-return-type
    language: typescript
    rule:
      kind: method_definition
      has:
        field: return_type
    message: "explicit return type detected"

  - id: explicit-return-type
    language: python
    rule:
      kind: function_definition
      has:
        field: return_type
    message: "explicit return type annotation detected"

  - id: explicit-return-type
    language: go
    rule:
      kind: function_declaration
      has:
        field: result
    message: "explicit return type detected"

  - id: explicit-return-type
    language: rust
    rule:
      kind: function_item
      has:
        field: return_type
    message: "explicit return type detected"
