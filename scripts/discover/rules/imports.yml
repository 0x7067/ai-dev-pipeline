# imports.yml — ast-grep rules for import pattern detection
# Detects named, default, and wildcard import styles.
# Used by extract.sh to feed boundary.py.

rules:
  - id: named-import
    language: typescript
    rule:
      kind: import_statement
      has:
        kind: import_clause
        has:
          kind: named_imports
    message: "named import detected"

  - id: named-import
    language: javascript
    rule:
      kind: import_statement
      has:
        kind: import_clause
        has:
          kind: named_imports
    message: "named import detected"

  - id: wildcard-import
    language: typescript
    rule:
      kind: import_statement
      has:
        kind: import_clause
        has:
          kind: namespace_import
    message: "wildcard import detected"

  - id: wildcard-import
    language: javascript
    rule:
      kind: import_statement
      has:
        kind: import_clause
        has:
          kind: namespace_import
    message: "wildcard import detected"

  - id: default-import
    language: typescript
    rule:
      kind: import_statement
      has:
        kind: import_clause
        not:
          has:
            kind: named_imports
    message: "default import detected"

  - id: default-import
    language: javascript
    rule:
      kind: import_statement
      has:
        kind: import_clause
        not:
          has:
            kind: named_imports
    message: "default import detected"

  - id: named-import
    language: python
    rule:
      kind: import_from_statement
    message: "named import detected"

  - id: default-import
    language: python
    rule:
      kind: import_statement
      not:
        has:
          kind: import_from_statement
    message: "default import detected"
