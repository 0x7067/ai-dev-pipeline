id: zero-setup-install
title: Zero-Setup Install
status: accepted
risk: medium
tags:
  - install
  - boundary
  - resolver
summary: |
  After plugin install, every interactive command works without /setup. The
  /setup command is retained but reframed as an opt-in step for users who
  need artifacts vendored into their repo (primarily because CI runners do
  not load Claude Code plugins and CI is the gate authority).
motivation: |
  Today the marketplace install of ai-dev-pipeline is not actually
  installable-and-go. Several agents and commands reference repo-local paths
  (scripts/run-verification-gates.sh, docs/templates/*.md,
  .claude/rules/*.md) that only exist after the user runs /setup. A user who
  installs the plugin and immediately runs /plan hits "template not found"
  and is told to run /setup first. That extra step is friction and
  undermines the marketplace install promise.
scope: |
  Define the resolver contract harness_resolve_artifact with repo-local
  precedence and plugin-root fallback; parse CLAUDE_PLUGIN_ROOT once per
  script via harness_parse_plugin_root; classify install mode via
  harness_classify_install_mode. Out of scope: auto-running /setup; removing
  /setup; non-bash CLI; changing gate ordering or risk-tier policy.
acceptance_criteria:
  - In a temp directory with only CLAUDE_PLUGIN_ROOT exported, every artifact path referenced by .claude/agents/*.md resolves successfully.
  - Running /plan immediately after marketplace install (no /setup) produces docs/current-plan.md without any "template not found" error.
  - Running /verify after marketplace install (no /setup) executes the canonical gate runner from the plugin install path and reports go/no-go.
  - After /setup, edits to a vendored template are visible to the corresponding agent on the next run (repo precedence verified).
  - CI template (templates/ci/github-actions-verify.yml.template) continues to require vendored scripts/run-verification-gates.sh.
  - scripts/run-verification-gates.sh itself can be invoked from any CWD inside a consuming repo and resolves its own siblings via the resolver.
  - README updated; zero-setup is the headline; /setup is a small "for CI" callout.
invariants:
  - Idempotence; harness_resolve_artifact P returns the same answer for fixed inputs.
  - Repo precedence; vendored copies are never shadowed by plugin updates.
  - Zero-setup totality; every artifact path referenced by an agent or command resolves in a fresh-install (no vendoring) state.
  - Vendored non-regression; existing vendored repos behave identically to today.
  - CI authority preserved; CI runs the vendored scripts/run-verification-gates.sh and the verified definition is unchanged.
boundary_map:
  - CLAUDE_PLUGIN_ROOT env -> harness_parse_plugin_root -> PluginRoot|Unset|Invalid
  - filesystem probe -> harness_classify_install_mode -> Vendored|ZeroSetup|Broken
references:
  - .claude/rules/release-and-verification.md
  - .claude/rules/architecture-fcis.md
  - .claude/rules/boundary-parse-dont-validate.md
  - CLAUDE.md
body_path: spec.md
