id: run-id-isolation
title: Run-ID-Based Artifact Isolation
status: accepted
risk: medium
tags:
  - runs
  - boundary
  - parallelism
summary: |
  Per-run artifact isolation under docs/runs/<run-id>/... plus per-run
  workflow-state at .claude/workflow-state/<run-id>.json, with an atomic
  docs/latest symlink (and docs/latest.txt fallback) as the discovery
  mechanism. Read-only verification gates (typecheck, lint, security) run
  in parallel; test gates remain sequential.
motivation: |
  Two /ship sessions on the same repo (CI + local; two worktrees; two
  Claude sessions) currently collide on docs/<report>.md,
  .claude/workflow-state.json, and docs/.verify-retry.json. Verifier
  wall-clock is dominated by sequential gate execution; the three
  read-only gates are independent and CPU-bound — a clean fan-out target.
scope: |
  Per-run artifact directories; per-run workflow-state; atomic latest
  pointer; parallel read-only gates; serial test gates; RUN_ID parser at
  every ingress (env, GITHUB_RUN_ID, latest.txt, latest symlink).
  Out-of-scope: test-gate parallelism; reviewer pragmatic-checklist
  parallelization; legacy compat symlinks; Windows symlink portability
  beyond latest.txt fallback.
acceptance_criteria:
  - See docs/runs/<RUN_ID>/current-plan.md Acceptance Criteria (authoritative copy lives there).
invariants:
  - Parse-once; no path expression includes a raw env/CLI/CI run-id.
  - Path containment; docs/runs/<run-id> is always a direct child of docs/runs/.
  - Atomic latest pointer.
  - Verify-retry hint per-run, truncated per gate.
  - Gate ordering semantics preserved under parallel fan-out.
  - Workflow-state per-run; hooks resolve active at fire time.
  - Retention never deletes the active run.
boundary_map:
  - RUN_ID env var -> scripts/parse-run-id.sh -> RunId
  - GITHUB_RUN_ID (CI) -> translation step -> parse-run-id.sh -> RunId
  - docs/latest.txt content -> scripts/resolve-run.sh (delegates) -> RunId
  - docs/latest symlink target basename -> resolve-run.sh -> RunId
  - Mint output (mint-run-id.sh) -> self-checked via parser -> RunId
references:
  - docs/templates/current-plan-template.md
  - .claude/rules/architecture-fcis.md
  - .claude/rules/boundary-parse-dont-validate.md
body_path: spec.md
